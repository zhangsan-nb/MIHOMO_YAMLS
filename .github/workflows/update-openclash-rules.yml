name: Update OpenClash Rule Mirror

on:
  workflow_dispatch:
  schedule:
    # Daily at 05:15 China Standard Time (UTC+8).
    - cron: "15 21 * * *"

permissions:
  contents: write

concurrency:
  group: openclash-rule-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4

      - name: Load previous rule manifest
        env:
          PREVIOUS_SOURCES: ${{ runner.temp }}/previous-SOURCES.tsv
          BASELINE_DIR: ${{ runner.temp }}/openclash-rules-baseline
        run: |
          mkdir -p "${BASELINE_DIR}"
          if git fetch --no-tags --depth=1 origin openclash-rules; then
            git show FETCH_HEAD:SOURCES.tsv > "${PREVIOUS_SOURCES}"
            git archive FETCH_HEAD | tar -x -C "${BASELINE_DIR}"
          else
            : > "${PREVIOUS_SOURCES}"
          fi

      - name: Download and validate all providers
        id: mirror
        env:
          OUTPUT_DIR: ${{ runner.temp }}/openclash-rules
          PREVIOUS_SOURCES: ${{ runner.temp }}/previous-SOURCES.tsv
        run: |
          set +e
          bash .github/scripts/mirror-openclash-rules.sh "${OUTPUT_DIR}" "${PREVIOUS_SOURCES}"
          status=$?
          set -e
          if [[ -f "${OUTPUT_DIR}/REPORT.md" ]]; then
            cat "${OUTPUT_DIR}/REPORT.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${status}"

      - name: Supply-chain audit gate
        id: audit
        env:
          OUTPUT_DIR: ${{ runner.temp }}/openclash-rules
          BASELINE_DIR: ${{ runner.temp }}/openclash-rules-baseline
        run: |
          python -m pip install --user pyyaml
          python audit/scripts/audit.py run \
            --audit-dir audit \
            --baseline "${BASELINE_DIR}" \
            --candidate "${OUTPUT_DIR}" \
            --out "${OUTPUT_DIR}/audit-report.json" \
            --oracle auto \
            --fail-closed
          if [[ -f "${OUTPUT_DIR}/audit-report.txt" ]]; then
            cat "${OUTPUT_DIR}/audit-report.txt" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-audit-report
          path: |
            ${{ runner.temp }}/openclash-rules/audit-report.json
            ${{ runner.temp }}/openclash-rules/audit-report.txt
          if-no-files-found: ignore

      - name: Publish atomically to openclash-rules branch
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}/openclash-rules
        run: |
          cd "${OUTPUT_DIR}"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b openclash-rules
          git add -- domain ip classical yaml fakeip README.md SOURCES.tsv SHA256SUMS
          if [[ -d source ]]; then git add -- source; fi
          if [[ -f baseline.json ]]; then git add -- baseline.json; fi
          if [[ -d .audit ]]; then git add -- .audit; fi
          git commit -m "Update OpenClash rules $(date -u +'%Y-%m-%d')"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          attempt=0
          until git push --force origin HEAD:openclash-rules; do
            attempt=$((attempt + 1))
            if (( attempt >= 3 )); then
              echo "push to openclash-rules failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "push attempt ${attempt} failed; retrying in 15s" >&2
            sleep 15
          done

      - name: Purge mirrored files from jsDelivr
        id: purge
        if: success()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/openclash-rules
        run: |
          cd "${OUTPUT_DIR}"
          purge_failures=0
          while IFS= read -r -d '' file; do
            relative_path="${file#./}"
            if ! curl --fail --silent --show-error \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@openclash-rules/${relative_path}" \
              >/dev/null; then
              echo "jsDelivr purge failed for ${relative_path}" >&2
              purge_failures=$((purge_failures + 1))
            fi
          done < <(find . -type f -print0)
          if (( purge_failures > 0 )); then
            echo "jsDelivr purge failed for ${purge_failures} file(s)" >&2
            exit 1
          fi

      - name: Email concise update report
        if: always()
        env:
          RULE_EMAIL_TO: ${{ secrets.RULE_EMAIL_TO }}
          RULE_EMAIL_FROM: ${{ secrets.RULE_EMAIL_FROM }}
          RULE_EMAIL_SMTP_HOST: ${{ secrets.RULE_EMAIL_SMTP_HOST }}
          RULE_EMAIL_SMTP_PORT: ${{ secrets.RULE_EMAIL_SMTP_PORT }}
          RULE_EMAIL_SMTP_SECURITY: ${{ secrets.RULE_EMAIL_SMTP_SECURITY }}
          RULE_EMAIL_SMTP_USERNAME: ${{ secrets.RULE_EMAIL_SMTP_USERNAME }}
          RULE_EMAIL_SMTP_PASSWORD: ${{ secrets.RULE_EMAIL_SMTP_PASSWORD }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PURGE_OUTCOME: ${{ steps.purge.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTPUT_DIR: ${{ runner.temp }}/openclash-rules
        run: python .github/scripts/send-rule-report.py "${OUTPUT_DIR}/REPORT.tsv"
