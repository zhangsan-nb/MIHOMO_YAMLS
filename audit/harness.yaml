# Isolated matcher harness. Policies are dummy select groups (DIRECT/REJECT only).
# Rule order matches qingliangban-mihomo-fork-custom.yaml among mirrored providers,
# plus the few inline DOMAIN-* lines from that config that sit between them.
# Personal airport/app RULE-SETs (de_*, us_paypal, ...) are omitted: they are not
# in this mirror. That is a documented coverage boundary.

policies:
  - REJECT
  - DIRECT
  - LOCATION
  - WIFI
  - AI
  - SPEEDTEST
  - TWITTER
  - TELEGRAM
  - SOCIAL
  - NEWS
  - GAMES
  - CRYPTO
  - EMBY
  - NETFLIX
  - YOUTUBE
  - STREAMING
  - APPLE
  - GOOGLE
  - GITHUB
  - MICROSOFT
  - PROXY
  - CHINA
  - FINAL

rules:
