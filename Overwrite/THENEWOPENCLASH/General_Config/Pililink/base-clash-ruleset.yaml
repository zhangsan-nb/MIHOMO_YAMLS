# rules（从源文件直接提取）
# ----------------------------------------------------------
# 原始规则列表，默认注释不启用。
# 常用操作：
#   +rules: [...]   在规则列表开头插入（优先匹配）
#   rules+: [...]   在规则列表末尾追加
#   rules!: [...]   强制替换整个规则列表（丢弃原有规则）
# 参考上方示例，通常不需要取消注释整个 rules，而是用 +rules/rules+ 追加即可。
# ==========================================================
#
# rules:
# - DOMAIN-SUFFIX,ts.net,🏠 家庭网络
# - IP-CIDR,192.168.31.0/24,🏠 家庭网络,no-resolve
# - IP-CIDR,192.168.100.0/24,🏠 家庭网络,no-resolve
# - IP-CIDR,100.64.0.0/10,🏠 家庭网络,no-resolve
# - RULE-SET,myignore,DIRECT
# - RULE-SET,myai,🤖 人工智能
# - RULE-SET,myproxy,🪜 代理域名
# - RULE-SET,private,🔒 私有网络
